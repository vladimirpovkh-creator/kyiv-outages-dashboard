name: Validate Forum Prazkyi monitor
on:
  pull_request:
  push:
    paths:
      - 'scripts/monitor_forum_prazkyi.py'
      - 'scripts/test_monitor_forum_prazkyi.py'
      - '.github/workflows/validate-forum-monitor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_monitor_forum_prazkyi.py' -v
      - run: python -m py_compile scripts/monitor_forum_prazkyi.py
