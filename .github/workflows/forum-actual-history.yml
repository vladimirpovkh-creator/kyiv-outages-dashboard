name: Build Forum Prazkyi actual outage history
on:
  schedule:
    - cron: '19 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_forum_actual_history.py'
      - '.github/workflows/forum-actual-history.yml'
permissions:
  contents: write
concurrency:
  group: forum-prazkyi-monitor
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Telegram client
        run: python -m pip install telethon==1.45.0
      - name: Backfill topic 63 actual outages without storing message content
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }
        run: |
          python scripts/build_forum_actual_history.py
          python -m json.tool data/forum-prazkyi-actual-history.json > /dev/null
      - name: Commit verified aggregate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forum-prazkyi-actual-history.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh Forum Prazkyi observed historical on-off hours"
            git pull --rebase
            git push
          fi
