name: Validate realtime Telegram monitor
on:
  pull_request:
    paths:
      - 'realtime/**'
      - 'scripts/test_realtime_monitor.py'
      - 'data/realtime-config.json'
      - '.github/workflows/validate-realtime.yml'
  push:
    paths:
      - 'realtime/**'
      - 'scripts/test_realtime_monitor.py'
      - 'data/realtime-config.json'
      - '.github/workflows/validate-realtime.yml'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install telethon==1.45.0 aiohttp==3.13.3
      - run: python -m unittest discover -s scripts -p 'test_realtime_monitor.py' -v
      - run: python -m py_compile realtime/monitor.py
