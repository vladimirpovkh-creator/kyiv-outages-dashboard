name: Fetch independent DTEK schedule backup
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: write
concurrency:
  group: backup-schedule
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate independent backup
        run: python scripts/fetch_backup_schedule.py
      - name: Publish verified structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backup-schedule.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh independently validated schedule backup"
            git pull --rebase
            git push
          fi
