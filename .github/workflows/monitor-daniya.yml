name: Monitor Daniya public Telegram status
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/monitor_daniya.py'
      - '.github/workflows/monitor-daniya.yml'
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: monitor-daniya
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public Telegram messages
        run: |
          python scripts/monitor_daniya.py
          python -m json.tool data/daniya-status.json > /dev/null
      - name: Publish latest verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daniya-status.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh Daniya public monitor status"
            git pull --rebase
            git push
          fi
