name: Forum Prazkyi topic 63 power monitor
# Manual reconciliation after delayed GitHub scheduled runs on 2026-11-08.
on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/monitor_forum_prazkyi.py'
      - '.github/workflows/forum-prazkyi-monitor.yml'
permissions:
  contents: write
concurrency:
  group: forum-prazkyi-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Telegram client
        run: python -m pip install telethon==1.45.0
      - name: Read topic messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python scripts/monitor_forum_prazkyi.py
          python -m json.tool data/forum-prazkyi-status.json > /dev/null
      - name: Publish validated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forum-prazkyi-status.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh Forum Prazkyi power status"
            git pull --rebase
            git push
          fi
