name: Check DTEK source daily
on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dtek-check.yml'
      - 'scripts/check_dtek.py'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official source (no inferred schedules)
        run: python scripts/check_dtek.py
      - name: Commit status when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          if ! git diff --staged --quiet; then
            git commit -m "Update official source check status"
            git push
          fi
