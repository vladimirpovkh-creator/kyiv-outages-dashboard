name: Validate dashboard UI
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test_dashboard_markup.py'
      - 'scripts/check_inline_js.py'
      - '.github/workflows/validate-dashboard.yml'
  push:
    paths:
      - 'index.html'
      - 'scripts/test_dashboard_markup.py'
      - 'scripts/check_inline_js.py'
      - '.github/workflows/validate-dashboard.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dashboard labels, tomorrow visibility and map embed
        run: python -m unittest discover -s scripts -p 'test_dashboard_markup.py' -v
      - name: Check JavaScript syntax
        run: python scripts/check_inline_js.py
